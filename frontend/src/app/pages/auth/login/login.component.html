<div class="login-container">
  <div class="login-box">
    <h1>CampusCore</h1>
    <p class="subtitle">
      College Management System
    </p>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        >
      </div>
      <div class="form-group">
        <label>Password</label>
        <input>
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
        >
      </div>
      <button type="submit">
        Login
      </button>
    </form>
  </div>
</div>
